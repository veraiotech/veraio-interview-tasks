<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Searching</title>
        <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <style>
            .hide {
                display: none;
            }
            .rotate {
                transition: transform 0.3s;
            }
            .asc {
                transform: rotate(180deg);
            }
        </style>
    </head>
<body class="bg-gray-100">

    <header class="bg-blue-600 text-white py-4 text-center">
        <h1 class="text-3xl font-bold">Search country</h1>
    </header>

    <div class="container mx-auto mt-6 p-4">
        <section class="formField mb-4">
            <input type="text" id="inputText" placeholder="Name of country ..." class="w-full p-2 border border-gray-300 rounded" />
        </section>

        <section class="apiResults" id="apiResultSection">
            <table class="min-w-full border border-gray-300">
                <thead>
                    <tr class="bg-gray-200">
                        <th id="sortByDefault" class="py-2 px-4 border-b text-left">Flag</th>
                        <th id="sortByName" class="py-2 px-4 border-b cursor-pointer hover:bg-gray-300 text-left">
                            Name <i class="fa-solid fa-arrow-up rotate" id="arrowName"></i>
                        </th>
                        <th id="sortByCapital" class="py-2 px-4 border-b cursor-pointer hover:bg-gray-300 text-left">
                            Capital <i class="fa-solid fa-arrow-up rotate" id="arrowCapital"></i>
                        </th>
                        <th id="sortByContinent" class="py-2 px-4 border-b cursor-pointer hover:bg-gray-300 text-left">
                            Continent <i class="fa-solid fa-arrow-up rotate" id="arrowContinent"></i>
                        </th>
                        <th id="sortByCurrency" class="py-2 px-4 border-b cursor-pointer hover:bg-gray-300 text-left">
                            Currency <i class="fa-solid fa-arrow-up rotate" id="arrowCurrency"></i>
                        </th>
                        <th id="sortByCCA" class="py-2 px-4 border-b cursor-pointer hover:bg-gray-300 text-left">
                            CCA <i class="fa-solid fa-arrow-up rotate" id="arrowCca"></i>
                        </th>
                        <th id="sortByPopulation" class="py-2 px-4 border-b cursor-pointer hover:bg-gray-300 text-left">
                            Population <i class="fa-solid fa-arrow-up rotate" id="arrowPopulation"></i>
                        </th>
                    </tr>
                </thead>
                <tbody id="results" class="bg-white"></tbody>
                <tfoot>
                    <tr>
                        <ht id="notFind" class="hide text-red-500 text-center">No matches ...</ht>
                    </tr>
                </tfoot>
            </table>

        
            <div class="flex justify-between mt-4">
                <div>
                    <label for="rowsPerPage" class="mr-2">Rows per page:</label>
                    <select id="rowsPerPage" class="border border-gray-300 rounded p-1">
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="100">100</option>
                    </select>
                </div>
                <div class="flex items-center">
                    <button id="prevPage" class="bg-blue-600 text-white py-1 px-3 rounded mr-2" disabled>Previous</button>
                    <span id="pageInfo">Page <span id="currentPage">1</span> of <span id="totalPages">1</span></span>
                    <button id="nextPage" class="bg-blue-600 text-white py-1 px-3 rounded ml-2" disabled>Next</button>
                </div>
            </div>
        </section>
        <!-- <h2 id="notFind" class="hide text-red-500 text-center">No matches</h2> -->
        
        <div id="modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
            <div class="bg-white rounded-lg p-6 w-11/12 md:w-1/2 lg:w-1/3 flex flex-col items-center"> <!-- Centered content -->
                <button id="closeModal" class="absolute top-2 right-2 text-gray-600 hover:text-gray-900 text-xl">✖</button>
                <h2 id="modalCountryName" class="text-2xl font-bold mb-2 text-center"></h2> <!-- Center text -->
                <img id="modalCountryFlag" class="w-32 h-auto mb-4" src="" alt="Country Flag"/> <!-- Centered flag -->
                <p class="text-lg text-center"><strong>Capital:</strong> <span id="modalCountryCapital"></span></p>
                <p class="text-lg text-center"><strong>Continent:</strong> <span id="modalCountryContinent"></span></p>
                <p class="text-lg text-center"><strong>Currency:</strong> <span id="modalCountryCurrency"></span></p>
                <p class="text-lg text-center"><strong>CCA:</strong> <span id="modalCountryCCA"></span></p>
                <p class="text-lg text-center"><strong>Population:</strong> <span id="modalCountryPopulation"></span></p>
            </div>
        </div>


    </div>

    <footer>
        <script src="main.js"></script>
    </footer>
    
</body>
</html>
